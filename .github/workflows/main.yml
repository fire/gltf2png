name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install base dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            libassimp-dev \
            libastcenc-dev \
            libdraco-dev \
            libegl-dev \
            libegl1-mesa-dev \
            libglfw3-dev \
            libimgui-dev \
            libminizip-dev \
            libspirv-cross-c-shared-dev \
            libstb-dev \
            libtinyexr-dev \
            libvulkan-dev \
            vulkan-tools \
            libgl1-mesa-dev \
            xvfb \
            cmake \
            ninja-build \
            git \
            libc++-dev \
            libc++abi-dev

      - name: Build Filament
        run: |
          git clone https://github.com/google/filament.git
          cd filament
          git checkout v1.29.0
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DFILAMENT_ENABLE_JAVA=OFF \
            -DCMAKE_INSTALL_PREFIX=./install \
            ..
          ninja install
          echo "FILAMENT_ROOT=$(pwd)/install" >> $GITHUB_ENV

      - name: Build meshoptimizer
        run: |
          git clone https://github.com/zeux/meshoptimizer.git
          cd meshoptimizer
          git checkout v0.18
          cmake . -B build -DCMAKE_BUILD_TYPE=Release
          sudo cmake --build build --target install
          cd ..

      - name: Build project with Make
        run: |
          export CXXFLAGS="-I${FILAMENT_ROOT}/include -I${FILAMENT_ROOT}/include/filament"
          export LDFLAGS="-L${FILAMENT_ROOT}/lib -L${FILAMENT_ROOT}/lib/x86_64-linux-gnu"
          make -j$(nproc)

      - name: Run rendering tests
        run: |
          export LD_LIBRARY_PATH="${FILAMENT_ROOT}/lib:${FILAMENT_ROOT}/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH"
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe

          mkdir -p test/images
          for filepath in test/models/*.glb; do
            filename=$(basename "$filepath")
            echo "Rendering ${filename%.*}"
            xvfb-run -a ./gltf2png "$filepath" 800x600 "test/images/${filename%.*}.png"
          done

          # Verify PNG outputs
          if [ -z "$(ls -A test/images/*.png 2>/dev/null)" ]; then
            echo "Error: No PNG files generated!"
            exit 1
          fi

      - name: Upload rendered images
        uses: actions/upload-artifact@v4
        with:
          name: rendered-output
          path: test/images/
          if-no-files-found: error
